<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 600 150'
    style='background-color: #00000000;'
    width='600px' height='150px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 500;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                    <path id='path0'>
                            <!-- Grouped lines: lines within a group type sequentially, all clear together -->
                                <animate id='d0' attributeName='d'
                    begin='0s;d2.end'
                    dur='6400ms'
                    fill='remove'
                    values='m0,31 h0 ; m0,31 h0 ; m0,31 h600 ; m0,31 h600 ; m0,31 h0'
                    keyTimes='0;0;0.225;0.94375;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#EF8B16' font-size='26'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            S L S L ——
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Grouped lines: lines within a group type sequentially, all clear together -->
                                <animate id='d1' attributeName='d'
                    begin='0s;d2.end'
                    dur='6400ms'
                    fill='remove'
                    values='m0,62 h0 ; m0,62 h0 ; m0,62 h600 ; m0,62 h600 ; m0,62 h0'
                    keyTimes='0;0.28125;0.50625;0.94375;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#EF8B16' font-size='26'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Stop Looking,
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Grouped lines: lines within a group type sequentially, all clear together -->
                                <animate id='d2' attributeName='d'
                    begin='0s;d2.end'
                    dur='6400ms'
                    fill='remove'
                    values='m0,93 h0 ; m0,93 h0 ; m0,93 h600 ; m0,93 h600 ; m0,93 h0'
                    keyTimes='0;0.5625;0.7875;0.94375;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#EF8B16' font-size='26'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Start Learning.
        </textPath>
    </text>
</svg>
